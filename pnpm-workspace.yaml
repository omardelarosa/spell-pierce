# Supply-chain hardening (see https://pnpm.io/supply-chain-security)

# Don't install versions published less than 7 days ago.
minimumReleaseAge: 10080

# Refuse versions whose publish trust level dropped vs. earlier releases.
trustPolicy: no-downgrade

# Exact versions reviewed by hand. Each was published by the same account as
# that package's other releases; it only lost provenance compared to a few
# old releases. Re-review whenever one of these needs bumping.
trustPolicyExclude:
  # netlify-bot published 125/126 versions; provenance only on 1.3.0–1.5.2 (2023)
  - '@netlify/serverless-functions-api@2.28.1 || 2.24.0'

# Transitive deps must come from the registry, not git URLs or tarballs.
blockExoticSubdeps: true

# Dependency install scripts are blocked unless listed here.
allowBuilds:
  # postinstall only checks/links the prebuilt platform binary; published with SLSA provenance
  esbuild: true
